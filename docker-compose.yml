services:
  bot:
    build: .
    container_name: redheadguy-guide-bot
    restart: always
    env_file:
      - .env
    volumes:
      # Монтируем контент/медиа/логи, чтобы изменения и логи переживали пересборку
      - ./media:/app/media
      - ./logs:/app/logs
      # ВАЖНО: монтируем ВСЮ папку data/, а не отдельные файлы.
      # Если монтировать guides.json отдельным файлом, то при атомарной замене
      # (os.replace в веб-редакторе) контейнер продолжит видеть старый inode
      # и не увидит новые гайды. Монтаж папки решает эту проблему.
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: redheadguy-guide-web
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Общий файл контента с ботом
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # Позволяем переменным окружения переопределить имя сайта при необходимости
      - WEB_SITE_NAME=${WEB_SITE_NAME:-RedheadGuy Admin}
