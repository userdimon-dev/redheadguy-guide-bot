version: "3.8"

services:
  bot:
    build: .
    container_name: redheadguy-guide-bot
    restart: always
    env_file:
      - .env
    volumes:
      # Монтируем контент/медиа/логи, чтобы изменения и логи переживали пересборку
      - ./media:/app/media
      - ./logs:/app/logs
      # Файл контента (гайды) — чтобы правки через админку сохранялись
      - ./data/guides.json:/app/data/guides.json
      - ./data/users.json:/app/data/users.json

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: redheadguy-guide-web
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Общий файл контента с ботом
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # Позволяем переменным окружения переопределить имя сайта при необходимости
      - WEB_SITE_NAME=${WEB_SITE_NAME:-RedheadGuy Admin}

