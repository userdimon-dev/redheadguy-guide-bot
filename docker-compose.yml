  bot:
    build: .
    container_name: redheadguy-guide-bot
    restart: always
    env_file:
      - .env
    volumes:
      # Монтируем контент/медиа/логи, чтобы изменения и логи переживали пересборку
      - ./media:/app/media
      - ./logs:/app/logs
      # Файл контента (гайды) — чтобы правки через админку сохранялись
      - ./data/guides.json:/app/data/guides.json

