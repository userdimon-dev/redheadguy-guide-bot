# Прод-версия через Docker Compose
# Использование: docker compose -f docker-compose.prod.yml up -d
version: "3.8"

services:
  bot:
    build: .
    container_name: redheadguy-guide-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./data/guides.json:/app/data/guides.json
      # Контент (гайды) монтируем, чтобы не пересобирать образ при правках
      - ./guides.py:/app/guides.py:ro
      - ./config.py:/app/config.py:ro

