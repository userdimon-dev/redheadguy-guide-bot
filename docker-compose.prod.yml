# Прод-версия через Docker Compose
# Использование: docker compose -f docker-compose.prod.yml up -d

services:
  bot:
    build: .
    container_name: redheadguy-guide-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: redheadguy-guide-web
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./media:/app/media
    environment:
      - WEB_SITE_NAME=${WEB_SITE_NAME:-RedheadGuy Admin}

